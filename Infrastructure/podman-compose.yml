version: "3.8"

networks:
  oduva-net:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: oduva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SERVICE_DB_NAME: ${SERVICE_DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      - oduva-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: oduva-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: http://${PUBLIC_HOST}:${PUBLIC_PORT}/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oduva-net
    healthcheck:
      # The Keycloak image ships no curl/wget; use bash's /dev/tcp instead.
      # Health path is prefixed with KC_HTTP_RELATIVE_PATH just like every other route.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  oduva-marga-service:
    build:
      context: ../oduva-marga-service
      dockerfile: Dockerfile
    image: oduva-marga-service:latest
    container_name: oduva-marga-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SERVICE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oduva-net

  oduva-marga-bff:
    build:
      context: ../oduva-marga-bff
      dockerfile: Dockerfile
    image: oduva-marga-bff:latest
    container_name: oduva-marga-bff
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      SERVICE_BASE_URL: http://oduva-marga-service:8082
      OIDC_ISSUER_URI: http://${PUBLIC_HOST}:${PUBLIC_PORT}/auth/realms/${KEYCLOAK_REALM}
      OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
    depends_on:
      - oduva-marga-service
      - keycloak
    networks:
      - oduva-net

  oduva-mage-front-end:
    build:
      context: ../oduva-mage-front-end
      dockerfile: Dockerfile
    image: oduva-mage-front-end:latest
    container_name: oduva-mage-front-end
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT}:80"
    depends_on:
      - oduva-marga-bff
      - keycloak
    networks:
      - oduva-net
