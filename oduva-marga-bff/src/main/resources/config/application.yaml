spring:
  application:
    name: oduva-marga-bff
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${CLINET_ID:oduvamarga}
            client-secret: ${CLIENT_SECRET}
            scope: openid
        provider:
          keycloak:
            issuer-uri: ${ISSUER_URI:http://auth.om.local/realms/test}
logging:
  level:
    org:
      springframework:
        security: TRACE
        web: DEBUG
        web.client.RestTemplate: DEBUG

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Set by Infrastructure/podman-compose.yml. Not yet wired into Spring Security —
# placeholders for when the BFF's OAuth2 resource-server config is built out.
oduva:
  service-base-url: ${SERVICE_BASE_URL:http://localhost:8082}
