spring:
  application:
    name: oduva-marga-bff

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# Set by Infrastructure/podman-compose.yml. Not yet wired into Spring Security —
# placeholders for when the BFF's OAuth2 resource-server config is built out.
oduva:
  service-base-url: ${SERVICE_BASE_URL:http://localhost:8082}
  oidc:
    issuer-uri: ${OIDC_ISSUER_URI:}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
