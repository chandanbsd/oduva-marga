<form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-page">
  <h1>Log In</h1>

  <mat-form-field appearance="outline" class="login-page__field">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="username" />
    @if (form.controls.email.hasError('required')) {
      <mat-error>Email is required.</mat-error>
    }
  </mat-form-field>

  <mat-form-field appearance="outline" class="login-page__field">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.hasError('required')) {
      <mat-error>Password is required.</mat-error>
    }
  </mat-form-field>

  @if (loginError()) {
    <p class="login-page__error" role="alert">{{ loginError() }}</p>
  }

  <button mat-flat-button color="primary" type="submit" [disabled]="isAuthenticating()">
    @if (isAuthenticating()) {
      <mat-spinner diameter="20" />
    } @else {
      Log in
    }
  </button>
</form>
